set -g mouse on
set-option -g default-shell /bin/zsh
#Sets command history
set-option -g history-limit 100000

#Set two prefixs one of them is for everyday use the other is just incase I use the defualt tmux prefix
set-option -g prefix ^A

set -g base-index 1
set -g detach-on-destroy off
set -g escape-time 0
set -g set-clipboard on
set -g renumber-windows on
set -g status-position top
setw -g mode-keys vi

#Staus Bar Beautification
# Color theme: dark background + neon red/orange text
set -g status-style "bg=black,fg=colour202"  # Orange/red glow
set -g status-left-length 50
set -g status-right-length 100

# Use bold, glowing segments with powerline symbols
set -g status-left "#[fg=colour196,bg=black,bold] ⮞ Nex's Playground #[fg=black,bg=colour196]"
set -g status-right "#[fg=black,bg=colour196]#[fg=colour196,bg=black] Connected #[default]"

# Pane borders
set -g pane-border-style "fg=colour240"
set -g pane-active-border-style "fg=colour196"

# Message styling (e.g. for prompts)
set -g message-style "bg=black,fg=colour196"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-yank'

run '~/.tmux/plugins/tmux-yank/yank.tmux'
run '~/.tmux/plugins/tpm/tpm'
