##########################################
### VARIABLES
##########################################
$mainMod = SUPER
$terminal = kitty
$menu = rofi -show drun -config ~/.config/rofi/cyberpunk.rasi
$browser = firefox

##########################################
### MONITOR (leave as default-safe)
##########################################
monitor = ,preferred,auto,1

##########################################
### GENERAL
##########################################
general {
    border_size = 3

    # Cyberpunk borders
    col.active_border = rgba(ff4c4cff) rgba(44ffffff) 45deg
    col.inactive_border = rgba(2e0000ff)
}

##########################################
### DECORATION
##########################################
decoration {
    rounding = 8

    # Neon glow shadows
    shadow {
      enabled = true
      range = 20 
      render_power =20
      color = rgba(ff4c4cee)
      color_inactive = rgba(00000099)
    }

    blur {
      enabled = true
      size = 6
      passes = 2
      new_optimizations = true
    }


}
animations {
      bezier = myBezier, 0.05, 0.9, 0.1, 1.0
    
      animation = windows, 1, 5, myBezier
      animation = windowsOut, 1, 5, default, popin 80%
      animation = fade, 1, 7, default
      animation = workspaces, 1, 6, default
    }

##########################################
### MISC (remove bottom text)
##########################################
misc {
    disable_hyprland_logo = true
}

##########################################
### INPUT (DEFAULT-LIKE)
##########################################
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

##########################################
### KEYBINDS (DEFAULT + CYBERPUNK)
##########################################

# Launch
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, r, exec, $menu
bind = $mainMod, b, exec, $browser

# Window control
bind = $mainMod, Q, killactive
bind = $mainMod, X, exec, systemctl poweroff -i
bind = $mainMod, S, exec, systemctl suspend
bind = $mainMod, F, fullscreen
bind = $mainMod SHIFT, SPACE, togglefloating
bind = $mainMod SHIFT, P, pin, active

# Reload / exit
bind = $mainMod SHIFT, Q, exit

##########################################
### FOCUS MOVEMENT (DEFAULT-STYLE)
##########################################
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# Vim-style (optional but common)
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

##########################################
### MOVE WINDOWS
##########################################
bind = $mainMod SHIFT, left,  movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up,    movewindow, u
bind = $mainMod SHIFT, down,  movewindow, d

##########################################
### WORKSPACES (1–9, STOCK)
##########################################
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

##########################################
### MOUSE BINDS (IMPORTANT)
##########################################

# Move window with mouse
bindm = $mainMod, mouse:272, movewindow

# Resize window with mouse
bindm = $mainMod, mouse:273, resizewindow


env = QT_QPA_PLATFORMTHEME,qt6ct


##########################################
### AUTOSTART
##########################################
exec-once = waybar
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = awww-daemon
exec-once = awww img ~/Pictures/backgroundblackandred.jpg --transition-type fade
exec-once = xembedsniproxy
exec-once = [workspace 4 silent] steam
exec-once = [workspace 3 silent] discord

##########################################
### OPTIONAL FLOAT RULES (SAFE)
##########################################
#windowrule = float, class:^(pavucontrol|blueman-manager)$
#windowrule = center, class:^(pavucontrol|blueman-manager)$
windowrule = workspace 3 silent, match:class discord
widnowrule = workspace 4 silent, match:initial_class steam
