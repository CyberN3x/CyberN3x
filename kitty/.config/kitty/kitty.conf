# ~/.config/kitty/kitty.conf

##########
# Startup
##########
# Start tmux and attach/create session "main"
shell tmux new-session -A -s main

# Window size (in terminal cells)
remember_window_size no
initial_window_width 150c
initial_window_height 50c

##########
# Fonts
##########
font_size 12

# Adjust these family names to match `fc-list` output if needed
font_family JetBrainsMono Nerd Font
# Fallback fonts
fallback_font FiraCode Nerd Font
fallback_font Noto Color Emoji

# (Optional, but nice with nerd fonts)
enable_ligatures always

##########
# Colors
##########
foreground            #FF4C4C
background            #000000

cursor                #FF4C4C
selection_background  #550000

dynamic_background_opacity yes
background_opacity .75
# selection_foreground #ffffff  # uncomment if you want forced selection fg

# ANSI colors (same order as WezTerm's ansi)
color0  #000000  
color1  #FF4C4C  
color2  #44FF44  
color3  #FFFF00 
color4  #44FFFF
color5  #FF44FF 
color6  #44FFFF
color7  #CCCCCC 

# Bright colors (WezTerm brights)
color8   #555555 
color9   #FF6666 
color10  #66FF66
color11  #FFFF66
color12  #66FFFF
color13  #FF66FF
color14  #66FFFF 
color15  #FFFFFF 

##########
# Tab bar (Powerline-ish style similar to your WezTerm theme)
##########
tab_bar_style powerline
tab_bar_edge top
tab_bar_background #000000

# Active tab = darker bg, bright red fg
active_tab_foreground   #f50505
active_tab_background   #030303

# Inactive tab = dark red bg, muted grey fg
inactive_tab_foreground #403e3e
inactive_tab_background #2e0000

# Optional: tweak tab padding
tab_bar_margin_width 0.0
tab_bar_margin_height 0.0
tab_title_template "{index}: {title}"

